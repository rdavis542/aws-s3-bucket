name: "AWS S3 Bucket Destroy"

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "destroy" to confirm destruction of all resources'
        required: true
        type: string
      target_resource:
        description: 'Optional: Specific resource to destroy (leave empty for all)'
        required: false
        type: string

# Prevent concurrent destroy operations
concurrency:
  group: terraform-destroy
  cancel-in-progress: false

jobs:
  terraform:
    uses: rdavis542/aws-github-workflows/.github/workflows/tf-destroy.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      aws_region: us-east-2
      tf_vars: '{"bucket_prefix":"example-bucket-test"}'
    secrets: inherit
