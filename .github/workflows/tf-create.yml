name: "AWS S3 Bucket Build"

on:
  push:
    branches: ["main"]
    paths:
      - 'terraform/**'
      - '.github/workflows/tf-create.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'terraform/**'
  workflow_dispatch:

# Prevent concurrent runs to avoid state conflicts
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    uses: rdavis542/aws-github-workflows/.github/workflows/tf-plan-apply.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      aws_region: us-east-2
      tf_vars: '{"bucket_prefix":"example-bucket-test"}'
    secrets: inherit
